name: TIMflix package

# The TIMflix fork's own build: the STABLE flavour (`de.mutenroshi.timflix`) as a release build,
# uploaded as a workflow artifact for installing on the television by hand. Telemetry is not
# compiled in — no credential pair is passed, so `telemetry::sender::configured()` is false at
# compile time and nothing is ever sent. The upstream release/nightly/rc pipelines stay as they
# are; they need the original project's secrets and are not used by this fork.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: TIMflix stable package (armv7)
    # MUST be arm64 Linux: the webOS NDK has no linux-x86_64 build (see ci.yml's cross-build).
    runs-on: ubuntu-24.04-arm
    # ci.yml's cross-build measures ~5 min with warm caches; a cold first run builds FFmpeg too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust and the armv7 target
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust-modules
          key: armv7-stable

      - name: Cache the pinned downloads
        uses: ./.github/actions/deps-cache

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Cache the bundled FFmpeg
        # Same key as ci.yml's cross-build: the script re-derives its own key, so a stale restore
        # can only miss and rebuild, never hand back wrong objects.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/plxnative/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/dependencies.json', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', '.github/actions/webos-ndk/action.yml') }}

      - name: Build
        run: make FLAVOR=stable RELEASE=1 WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}' -j"$(nproc)"

      - name: Package
        run: make ipk FLAVOR=stable RELEASE=1 WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}'

      - name: Packaging assertions
        env:
          REQUIRE_PACKAGE: "1"
        run: python3 ci/check-package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timflix-${{ github.sha }}
          path: |
            pkg/*.ipk
            pkg/ipk.sha256
          if-no-files-found: error
